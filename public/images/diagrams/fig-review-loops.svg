<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 12.2. Two loops: weekly and monthly</title><desc id="d">Two cycles side by side. Every Friday: fill in the scorecard, compare to last week, choose one change, stop until Monday. Monthly, one hour: which source gave the most appointments per hour, which plan got the most replies, where leads stalled, and what one change to make this month.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 12.2. Two loops: weekly and monthly</text><rect x="40" y="100" width="590" height="440" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="335" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#2563EB">Every Friday</text><rect x="75.0" y="207.0" width="250" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="200.0" y="261.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Fill in the scorecard</text><rect x="345.0" y="207.0" width="250" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="470.0" y="261.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Compare to last week</text><rect x="345.0" y="337.0" width="250" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="470.0" y="391.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Choose one change</text><rect x="75.0" y="337.0" width="250" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="200.0" y="391.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Stop until Monday</text><path d="M331,255 L337,255" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M470,309 L470,329" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M339,385 L333,385" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M200,331 L200,311" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="650" y="100" width="590" height="440" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="945" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A8A">Monthly, one hour</text><rect x="685.0" y="207.0" width="250" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="810.0" y="239.4" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Which source gave the</text><text x="810.0" y="261.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">most appointments per</text><text x="810.0" y="282.9" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">hour?</text><rect x="955.0" y="207.0" width="250" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1080.0" y="250.2" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Which plan got the most</text><text x="1080.0" y="272.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">replies?</text><rect x="955.0" y="337.0" width="250" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1080.0" y="391.1" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">Where did leads stall?</text><rect x="685.0" y="337.0" width="250" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="810.0" y="380.2" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">What one change this</text><text x="810.0" y="402.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0F172A">month?</text><path d="M941,255 L947,255" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><path d="M1080,309 L1080,329" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><path d="M949,385 L943,385" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><path d="M810,331 L810,311" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><text x="640" y="590" text-anchor="middle" font-size="21" font-weight="700" fill="#2563EB">Write the answers in your CRM as a note to yourself.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Small corrections every week, a bigger decision every month.</text></svg>