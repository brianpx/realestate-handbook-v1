<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 9.2. An objection is a question in disguise</title><desc id="d">Four boxes: acknowledge, clarify, respond, check, each with an example line beneath for the objection about waiting for the market to improve. A loop on clarify says to ask again until you hear the real concern.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 9.2. An objection is a question in disguise</text><rect x="40" y="200" width="270" height="130" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="175.0" y="260.2" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">1 Acknowledge</text><text x="175.0" y="287.9" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">“That makes sense.”</text><rect x="40" y="380" width="270" height="110" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="175.0" y="441.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">That's a common thought.</text><path d="M175,332 L175,378" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M312,265 L348,265" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="350" y="200" width="270" height="130" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="485.0" y="246.8" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">2 Clarify</text><text x="485.0" y="274.5" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">“Can I ask what's</text><text x="485.0" y="301.4" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">behind that?”</text><rect x="350" y="380" width="270" height="110" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="485.0" y="430.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">What would need to happen</text><text x="485.0" y="453.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">for you to feel ready?</text><path d="M485,332 L485,378" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M622,265 L658,265" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="660" y="200" width="270" height="130" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="795.0" y="246.8" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">3 Respond</text><text x="795.0" y="274.5" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">Facts, a story or a</text><text x="795.0" y="301.4" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">demonstration</text><rect x="660" y="380" width="270" height="110" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="795.0" y="430.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Here is what similar</text><text x="795.0" y="453.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">homes have done recently.</text><path d="M795,332 L795,378" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M932,265 L968,265" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="970" y="200" width="270" height="130" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="1105.0" y="246.8" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">4 Check</text><text x="1105.0" y="274.5" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">“Does that address</text><text x="1105.0" y="301.4" text-anchor="middle" font-size="21" font-weight="400" fill="#FFFFFF">it?”</text><rect x="970" y="380" width="270" height="110" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1105.0" y="430.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Does that help? Then stop</text><text x="1105.0" y="453.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">talking.</text><path d="M1105,332 L1105,378" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><path d="M420,198 C420,140 550,140 550,198" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="485" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Ask again until you hear the real concern</text><text x="640" y="536" text-anchor="middle" font-size="20" font-weight="400" fill="#334155" font-style="italic">Example objection: “We want to wait for the market to improve.” The real concern: “We're nervous.”</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Acknowledge, clarify, respond, check. Then be quiet.</text></svg>