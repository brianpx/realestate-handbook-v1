<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 3.1. One home base, many doors</title><desc id="d">A central box, Your home base, with five boxes pointing in: social profiles, email signature, business card, mailers and yard signs, and listing posts. An arrow from the home base leads to your CRM, which catches every inquiry.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 3.1. One home base, many doors</text><rect x="440" y="240" width="400" height="150" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="640.0" y="309.1" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Your home base</text><text x="640.0" y="341.9" text-anchor="middle" font-size="25" font-weight="400" fill="#FFFFFF">Agent Site and client app</text><rect x="50" y="120" width="260" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="180.0" y="163.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Social profiles</text><path d="M312,156 L438,290" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="50" y="250" width="260" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="180.0" y="293.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Email signature</text><path d="M312,286 L438,315" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="50" y="380" width="260" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="180.0" y="423.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Business card</text><path d="M312,416 L438,340" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="970" y="170" width="260" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1100.0" y="200.1" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Mailers and yard</text><text x="1100.0" y="227.0" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">signs</text><path d="M968,206 L842,290" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="970" y="330" width="260" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1100.0" y="373.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Listing posts</text><path d="M968,366 L842,340" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M640,392 L640,468" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="440" y="470" width="400" height="90" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="640.0" y="508.8" text-anchor="middle" font-size="22" font-weight="600" fill="#334155">Your CRM catches every</text><text x="640.0" y="537.0" text-anchor="middle" font-size="22" font-weight="600" fill="#334155">inquiry</text><text x="656" y="436" text-anchor="start" font-size="18" font-weight="700" fill="#2563EB">Every link points here</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Send every door to the same room.</text></svg>