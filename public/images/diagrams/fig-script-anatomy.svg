<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 6.1. Every script has four parts</title><desc id="d">The new-lead phone script split into four stacked parts: name them, show you read their inquiry, ask one question, then stop. Beside each part is the reason it works.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 6.1. Every script has four parts</text><text x="380" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">A new-lead phone script</text><text x="920" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Why it works</text><rect x="60" y="140" width="660" height="102" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M60,154 Q60,140 74,140 L88,140 L88,242 L74,242 Q60,242 60,228 Z" fill="#2563EB"/><text x="404" y="187.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">1 Name them</text><text x="404" y="210.9" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">“Hi [Name], this is [Your Name] with [Brokerage].”</text><rect x="760" y="140" width="470" height="102" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="995.0" y="197.8" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">People answer to their name.</text><rect x="60" y="258" width="660" height="102" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M60,272 Q60,258 74,258 L88,258 L88,360 L74,360 Q60,360 60,346 Z" fill="#2563EB"/><text x="404" y="305.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">2 Show you read it</text><text x="404" y="328.9" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">“I just saw your inquiry about [address or area].”</text><rect x="760" y="258" width="470" height="102" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="995.0" y="315.8" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Specific proves a human read it.</text><rect x="60" y="376" width="660" height="102" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M60,390 Q60,376 74,376 L88,376 L88,478 L74,478 Q60,478 60,464 Z" fill="#1E3A8A"/><text x="404" y="411.5" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">3 Ask one question</text><text x="404" y="435.4" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">“Do you have a couple of minutes so I can answer your</text><text x="404" y="458.4" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">questions?”</text><rect x="760" y="376" width="470" height="102" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="995.0" y="421.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">A message with no question rarely gets a</text><text x="995.0" y="446.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">reply.</text><rect x="60" y="494" width="660" height="102" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M60,508 Q60,494 74,494 L88,494 L88,596 L74,596 Q60,596 60,582 Z" fill="#1E3A8A"/><text x="404" y="541.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">4 Stop</text><text x="404" y="564.9" text-anchor="middle" font-size="18" font-weight="400" fill="#334155" font-style="italic">Wait. Let them answer.</text><rect x="760" y="494" width="470" height="102" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="995.0" y="551.8" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Silence is where they decide to engage.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Take any script apart and you will find these four.</text></svg>