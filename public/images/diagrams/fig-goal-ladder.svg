<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 1.1. From an income goal to a daily number</title><desc id="d">A funnel of six bars narrowing from an $80,000 income goal to 13 closings, 39 appointments, about 780 conversations, about 16 a week and 3 to 4 a day. The top three are lagging results and the bottom three are leading activity.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 1.1. From an income goal to a daily number</text><rect x="60.0" y="110" width="880" height="62" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="500.0" y="147.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Income goal: $80,000</text><rect x="110.0" y="186" width="780" height="62" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="500.0" y="223.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Closings: 13 (÷ $6,500 each)</text><rect x="160.0" y="262" width="680" height="62" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="500.0" y="299.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Appointments: 39 (about 3 per closing)</text><rect x="200.0" y="338" width="600" height="62" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="500.0" y="375.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Conversations: about 780 (about 20 per appointment)</text><rect x="260.0" y="414" width="480" height="62" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="500.0" y="451.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Per week: about 16 (÷ 48 weeks)</text><rect x="310.0" y="490" width="380" height="62" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="500.0" y="527.8" text-anchor="middle" font-size="19" font-weight="600" fill="#78350F">Per day: 3 to 4</text><path d="M965,110 L980,110 L980,320 L965,320" fill="none" stroke="#CBD5E1" stroke-width="3"/><text x="992" y="222" text-anchor="start" font-size="19" font-weight="700" fill="#1E3A8A">Lagging: results</text><path d="M965,338 L980,338 L980,548 L965,548" fill="none" stroke="#CBD5E1" stroke-width="3"/><text x="992" y="450" text-anchor="start" font-size="19" font-weight="700" fill="#2563EB">Leading: activity</text><text x="500" y="598" text-anchor="middle" font-size="22" font-weight="700" fill="#B45309">This is the only number you control today.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Work backward until you reach something you can do tomorrow morning.</text></svg>