<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 9.1. Spend half the meeting listening</title><desc id="d">A bar for a one-hour consultation split into Frame, Ask, Listen, Present and Agree, with Ask and Listen bracketed as at least half the meeting. A second grey bar shows a rushed meeting that is mostly presenting.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 9.1. Spend half the meeting listening</text><rect x="60" y="190" width="116.0" height="86" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="3"/><text x="118.0" y="240.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Frame</text><text x="118.0" y="320.5" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">Agree the</text><text x="118.0" y="341.0" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">agenda</text><rect x="176.0" y="190" width="290.0" height="86" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/><text x="321.0" y="240.2" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Ask</text><text x="321.0" y="320.5" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">Timeline, motivation,</text><text x="321.0" y="341.0" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">financing, must-haves</text><rect x="466.0" y="190" width="290.0" height="86" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/><text x="611.0" y="240.2" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Listen</text><text x="611.0" y="330.8" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">Repeat back what you heard</text><rect x="756.0" y="190" width="348.0" height="86" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="3"/><text x="930.0" y="240.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Present</text><text x="930.0" y="330.8" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">How it works, comparables, your plan</text><rect x="1104.0" y="190" width="116.0" height="86" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="3"/><text x="1162.0" y="240.2" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Agree</text><text x="1162.0" y="330.8" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">Next steps</text><path d="M176.0,170 L176.0,160 L756.0,160 L756.0,170" fill="none" stroke="#2563EB" stroke-width="3"/><text x="466.0" y="142" text-anchor="middle" font-size="21" font-weight="700" fill="#2563EB">At least half the meeting</text><text x="60" y="420" text-anchor="start" font-size="19" font-weight="700" fill="#334155">A rushed meeting</text><rect x="60" y="440" width="58.0" height="64" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="3"/><text x="89.0" y="476.7" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Frame</text><rect x="118.0" y="440" width="870.0" height="64" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="3"/><text x="553.0" y="478.5" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Present</text><rect x="988.0" y="440" width="232.0" height="64" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="3"/><text x="1104.0" y="478.5" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Agree</text><text x="640" y="548" text-anchor="middle" font-size="21" font-weight="700" fill="#B45309">Where trust is lost: asking and listening are skipped.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Proportions are illustrative. The rule is at least half for asking and listening.</text></svg>