<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 2.2. Working your sphere</title><desc id="d">Four boxes in a row: Announce, Give, Ask, Repeat. An arrow returns from Repeat to Give, not to Announce. A bar below says two to three gives before one ask.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 2.2. Working your sphere</text><rect x="35" y="150" width="250" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="160.0" y="210.2" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">1 Announce</text><text x="160.0" y="240.5" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">One personal</text><text x="160.0" y="269.9" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">message, not a</text><text x="160.0" y="299.4" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">blast</text><path d="M287,245 L353,245" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="355" y="150" width="250" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="480.0" y="195.5" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">2 Give</text><text x="480.0" y="225.8" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">A market update, a</text><text x="480.0" y="255.2" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">checklist, an</text><text x="480.0" y="284.6" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">introduction to a</text><text x="480.0" y="314.1" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">contractor</text><path d="M607,245 L673,245" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="675" y="150" width="250" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="800.0" y="195.5" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">3 Ask</text><text x="800.0" y="225.8" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">After two or three</text><text x="800.0" y="255.2" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">helpful touches,</text><text x="800.0" y="284.6" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">ask for an</text><text x="800.0" y="314.1" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">introduction</text><path d="M927,245 L993,245" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="995" y="150" width="250" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1120.0" y="224.9" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">4 Repeat</text><text x="1120.0" y="255.2" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">Put everyone on a</text><text x="1120.0" y="284.6" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">touch plan</text><path d="M1120,342 L1120,440 L480,440 L480,344" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="800" y="480" text-anchor="middle" font-size="20" font-weight="600" fill="#2563EB">Back to Give, not Announce. You announce only once.</text><rect x="35" y="530" width="1210" height="70" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="640.0" y="574.4" text-anchor="middle" font-size="26" font-weight="600" fill="#FFFFFF">Two to three gives before one ask.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Announce, give, ask, repeat.</text></svg>