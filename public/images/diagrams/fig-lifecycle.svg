<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 1. The client lifecycle</title><desc id="d">Three boxes in a loop: Find, Nurture, Keep. An arrow labelled Referrals leads from Keep back to Find. A bar beneath, labelled Your CRM, holds all three.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 1. The client lifecycle</text><rect x="80" y="140" width="320" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="240.0" y="213.1" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">1 Find</text><text x="240.0" y="245.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">Sphere, open houses,</text><text x="240.0" y="277.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">online leads, farming</text><rect x="480" y="140" width="320" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640.0" y="213.1" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">2 Nurture</text><text x="640.0" y="245.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">Calls, texts and</text><text x="640.0" y="277.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">emails over 90 days</text><rect x="880" y="140" width="320" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1040.0" y="197.1" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">3 Keep</text><text x="1040.0" y="229.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">Post-close plan,</text><text x="1040.0" y="261.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">anniversary,</text><text x="1040.0" y="293.9" text-anchor="middle" font-size="25" font-weight="400" fill="#0F172A">referrals</text><path d="M400,235 L478,235" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M800,235 L878,235" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M1040,332 L1040,430 L240,430 L240,334" fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><text x="640" y="468" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A8A">Referrals send new people back to Find</text><rect x="80" y="510" width="1120" height="90" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="640.0" y="550.2" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">Your CRM</text><text x="640.0" y="577.9" text-anchor="middle" font-size="21" font-weight="400" fill="#334155">Where every contact, task and follow-up plan lives</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Every chapter serves one of these three jobs.</text></svg>