<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 3. Your day opens and closes in your CRM</title><desc id="d">A left-to-right sequence: open your CRM, review the dashboard (15 minutes), clear follow-up tasks (45 to 60 minutes), prospect (60 to 90 minutes), appointments, then close your CRM. A return arrow labelled Tomorrow's top three leads back to the start. A bracket marks the first three blocks as protected.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 3. Your day opens and closes in your CRM</text><rect x="60" y="230" width="120" height="150" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="120.0" y="301.6" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Your CRM</text><text x="120.0" y="322.9" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">Open</text><rect x="206" y="230" width="170" height="150" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="291.0" y="277.3" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Review</text><text x="291.0" y="301.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">dashboard and</text><text x="291.0" y="325.9" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">tasks</text><text x="291.0" y="347.2" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">15 min</text><rect x="402" y="230" width="210" height="150" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="507.0" y="289.4" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Clear follow-up</text><text x="507.0" y="313.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">tasks</text><text x="507.0" y="335.1" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">45–60 min</text><rect x="638" y="230" width="230" height="150" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="753.0" y="301.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Prospect</text><text x="753.0" y="322.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">60–90 min</text><rect x="894" y="230" width="190" height="150" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="989.0" y="301.6" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Appointments</text><text x="989.0" y="322.9" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">as scheduled</text><rect x="1110" y="230" width="120" height="150" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="1170.0" y="301.6" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Your CRM</text><text x="1170.0" y="322.9" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">Close</text><path d="M182,305 L204,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M378,305 L400,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M614,305 L636,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M870,305 L892,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M1086,305 L1108,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M206,212 L868,212" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="537.0" y="192" text-anchor="middle" font-size="19" font-weight="700" fill="#B45309">Protect these three before you accept an appointment</text><path d="M1170,384 L1170,470 L120,470 L120,386" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="640" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#2563EB">Tomorrow's top three</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Follow-ups come before new prospecting.</text></svg>