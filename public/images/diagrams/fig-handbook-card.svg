<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 13.1. The whole handbook on one card</title><desc id="d">The Find, Nurture, Keep loop with your CRM at the center, surrounded by seven numbered rules: measure activity, work your sphere first, your CRM is the only list, respond in minutes and follow up 13 times, ask-listen-present-agree, post-close plan for every client, and review every Friday.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 13.1. The whole handbook on one card</text><rect x="40" y="110" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="230.0" y="153.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Measure activity, not closings: 3 to</text><text x="230.0" y="176.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">4 conversations a day</text><circle cx="420" cy="158" r="19" fill="#2563EB"/><text x="420" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text><rect x="40" y="225" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="230.0" y="268.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Work your sphere first. Buy leads</text><text x="230.0" y="291.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">only when the system can catch them.</text><circle cx="420" cy="273" r="19" fill="#2563EB"/><text x="420" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text><rect x="40" y="340" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="230.0" y="383.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Your CRM is the only list. Open it</text><text x="230.0" y="406.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">first, update it last.</text><circle cx="420" cy="388" r="19" fill="#2563EB"/><text x="420" y="395" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text><rect x="860" y="110" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1050.0" y="141.4" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Respond to new leads in minutes.</text><text x="1050.0" y="164.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Then follow up 13 times over 90</text><text x="1050.0" y="187.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">days.</text><circle cx="860" cy="158" r="19" fill="#2563EB"/><text x="860" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">4</text><rect x="860" y="225" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1050.0" y="268.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Ask, listen, present, agree.</text><text x="1050.0" y="291.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Objections are questions.</text><circle cx="860" cy="273" r="19" fill="#2563EB"/><text x="860" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">5</text><rect x="860" y="340" width="380" height="96" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1050.0" y="383.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Every closed client goes on a</text><text x="1050.0" y="406.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">post-close plan the day of closing.</text><circle cx="860" cy="388" r="19" fill="#2563EB"/><text x="860" y="395" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">6</text><rect x="445" y="143" width="150" height="54" rx="27" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="520.0" y="177.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Find</text><rect x="685" y="143" width="150" height="54" rx="27" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="760.0" y="177.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Nurture</text><rect x="565" y="353" width="150" height="54" rx="27" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="640.0" y="387.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Keep</text><path d="M601,170 L677,170" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M742,202 L659,346" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M622,348 L539,204" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><circle cx="640" cy="250" r="38" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><text x="640" y="257" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">CRM</text><rect x="40" y="470" width="1200" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640.0" y="525.9" text-anchor="middle" font-size="22" font-weight="600" fill="#0F172A">7 Review every Friday. Fix one thing a month. Ask your broker before anything unusual.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Print it. Put it where you work.</text></svg>