<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 11.2. When do I ask my broker?</title><desc id="d">A flow starting at something feels unusual. If it involves money, a contract, a disclosure or a protected class, stop and ask your broker. Otherwise, if the agent would not be comfortable with the broker reading the note, also ask the broker. Otherwise proceed and log it in the CRM today.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 11.2. When do I ask my broker?</text><rect x="40" y="300" width="240" height="84" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="160.0" y="336.1" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Something feels</text><text x="160.0" y="363.0" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">unusual</text><path d="M282,342 L340,342" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><polygon points="500,242.0 660.0,342 500,442.0 340.0,342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="500" y="317.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Does it involve</text><text x="500" y="337.5" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">money, a contract,</text><text x="500" y="358.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">a disclosure or a</text><text x="500" y="378.5" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">protected class?</text><path d="M500,242 L500,196" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="514" y="224" text-anchor="start" font-size="18" font-weight="700" fill="#2563EB">Yes</text><rect x="330" y="108" width="340" height="88" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="500.0" y="146.1" text-anchor="middle" font-size="21" font-weight="600" fill="#78350F">Stop. Ask your broker</text><text x="500.0" y="173.0" text-anchor="middle" font-size="21" font-weight="600" fill="#78350F">before you act.</text><path d="M660,342 L760,342" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="710" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">No</text><polygon points="920,242.0 1080.0,342 920,442.0 760.0,342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="920" y="306.8" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Would I be</text><text x="920" y="327.3" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">comfortable if my</text><text x="920" y="347.8" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">broker read the</text><text x="920" y="368.2" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">note I am about to</text><text x="920" y="388.7" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">write?</text><path d="M920,242 L920,152 L672,152" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/><text x="934" y="222" text-anchor="start" font-size="18" font-weight="700" fill="#B45309">No</text><path d="M920,442 L920,504" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="934" y="478" text-anchor="start" font-size="18" font-weight="700" fill="#2563EB">Yes</text><rect x="770" y="506" width="300" height="80" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="920.0" y="540.1" text-anchor="middle" font-size="21" font-weight="600" fill="#334155">Proceed. Log it in</text><text x="920.0" y="567.0" text-anchor="middle" font-size="21" font-weight="600" fill="#334155">your CRM today.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Two questions, asked in order.</text></svg>