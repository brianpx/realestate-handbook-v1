<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 2.3. The open house is a three-day event</title><desc id="d">A three-stage timeline. Before: preview the home, invite neighbors, set up digital sign-in. During: greet, capture contact details, offer a next step. After: text that evening, call next morning, start a follow-up plan, log the lead source. A final box says to measure cost per closed deal.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 2.3. The open house is a three-day event</text><rect x="40" y="120" width="370" height="370" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M40,176 L40,134 Q40,120 54,120 L396,120 Q410,120 410,134 L410,176 Z" fill="#1E3A8A"/><text x="225" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Before: the day before</text><circle cx="69" cy="214.0" r="3.5" fill="#2563EB"/><text x="84" y="220" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Preview the home and five</text><text x="84" y="246.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">comparable sales</text><circle cx="69" cy="280.0" r="3.5" fill="#2563EB"/><text x="84" y="286.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Invite the 20 nearest</text><text x="84" y="312.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">neighbors</text><circle cx="69" cy="346.0" r="3.5" fill="#2563EB"/><text x="84" y="352.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Set up digital sign-in</text><path d="M412,305 L448,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="450" y="120" width="370" height="370" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M450,176 L450,134 Q450,120 464,120 L806,120 Q820,120 820,134 L820,176 Z" fill="#1E3A8A"/><text x="635" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">During</text><circle cx="479" cy="214.0" r="3.5" fill="#2563EB"/><text x="494" y="220" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Greet and ask one open</text><text x="494" y="246.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">question</text><circle cx="479" cy="280.0" r="3.5" fill="#2563EB"/><text x="494" y="286.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Capture name, phone and</text><text x="494" y="312.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">email</text><circle cx="479" cy="346.0" r="3.5" fill="#2563EB"/><text x="494" y="352.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Offer one concrete next step</text><path d="M822,305 L858,305" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="860" y="120" width="370" height="370" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M860,176 L860,134 Q860,120 874,120 L1216,120 Q1230,120 1230,134 L1230,176 Z" fill="#1E3A8A"/><text x="1045" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">After: within 24 hours</text><circle cx="889" cy="214.0" r="3.5" fill="#2563EB"/><text x="904" y="220" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Text that evening</text><circle cx="889" cy="254.0" r="3.5" fill="#2563EB"/><text x="904" y="260.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Call the next morning</text><circle cx="889" cy="294.0" r="3.5" fill="#2563EB"/><text x="904" y="300.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Put every visitor on a</text><text x="904" y="326.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">follow-up plan</text><circle cx="889" cy="360.0" r="3.5" fill="#2563EB"/><text x="904" y="366.0" text-anchor="start" font-size="20" font-weight="400" fill="#334155">Log it as a lead source</text><rect x="300" y="520" width="680" height="74" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640.0" y="564.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Then measure it: cost per closed deal for this source</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Preparation and follow-up are where the leads are made.</text></svg>