<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 3.2. One listing, five posts, two kinds of leads</title><desc id="d">A timeline of five posts for one listing: coming soon, just listed, open house, under contract, just sold. Blue arrows mark where buyer leads arise and deep-blue arrows mark where seller leads arise. A callout says the just sold post is the best seller-lead post.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 3.2. One listing, five posts, two kinds of leads</text><path d="M60,360 L1220,360" stroke="#CBD5E1" stroke-width="5"/><rect x="65" y="334" width="170" height="52" rx="26" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="150.0" y="367.2" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Coming soon</text><rect x="280" y="334" width="170" height="52" rx="26" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="365.0" y="367.2" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Just listed</text><rect x="495" y="334" width="170" height="52" rx="26" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="580.0" y="367.2" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Open house</text><rect x="710" y="334" width="170" height="52" rx="26" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="795.0" y="354.4" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Under</text><text x="795.0" y="380.0" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">contract</text><rect x="925" y="334" width="170" height="52" rx="26" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="1010.0" y="367.2" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">Just sold</text><path d="M150,330 L150,262" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="150" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Buyer leads</text><path d="M365,330 L365,262" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="365" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Buyer leads</text><path d="M580,330 L580,262" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="580" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Buyer leads</text><path d="M365,390 L365,458" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><text x="365" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">Seller leads</text><path d="M580,390 L580,458" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><text x="580" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">Seller leads</text><path d="M1010,390 L1010,458" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><text x="1010" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">Seller leads</text><rect x="70" y="530" width="590" height="62" rx="14" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="365.0" y="555.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Mail or knock on the 50 nearest homes before the open</text><text x="365.0" y="580.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">house</text><rect x="880" y="520" width="340" height="90" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="1050.0" y="548.4" text-anchor="middle" font-size="18" font-weight="400" fill="#78350F">Best seller-lead post: say how</text><text x="1050.0" y="571.5" text-anchor="middle" font-size="18" font-weight="400" fill="#78350F">many showings or offers it</text><text x="1050.0" y="594.5" text-anchor="middle" font-size="18" font-weight="400" fill="#78350F">received</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Every stage of a listing is a chance to be seen.</text></svg>