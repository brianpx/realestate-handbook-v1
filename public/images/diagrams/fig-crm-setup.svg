<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 4.3. Six steps, one week</title><desc id="d">A vertical path of six numbered steps: profile, import and tag contacts, follow-up plans, lead routing for teams only, pipeline stages, and mobile app with notifications. A side box says to do them in order in one week.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 4.3. Six steps, one week</text><path d="M180,130 L180,590" stroke="#CBD5E1" stroke-width="5"/><circle cx="180" cy="150" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="180" y="159" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1</text><text x="240" y="146" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Profile</text><text x="240" y="174" text-anchor="start" font-size="18" font-weight="400" fill="#334155">Photo, bio, phone, email, license number, brand colors</text><circle cx="180" cy="234" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="180" y="243" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text><text x="240" y="230" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Import and tag contacts</text><text x="240" y="258" text-anchor="start" font-size="18" font-weight="400" fill="#334155">Deduplicate, then tag by relationship and by source</text><circle cx="180" cy="318" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="180" y="327" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3</text><text x="240" y="314" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Follow-up plans</text><text x="240" y="342" text-anchor="start" font-size="18" font-weight="400" fill="#334155">8x8, quarterly call plan, new-lead plan, post-close plan</text><circle cx="180" cy="402" r="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 5"/><text x="180" y="411" text-anchor="middle" font-size="26" font-weight="700" fill="#2563EB">4</text><text x="240" y="398" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Lead routing</text><text x="240" y="426" text-anchor="start" font-size="18" font-weight="400" fill="#334155">Teams only: inquiries reach the right person instantly</text><circle cx="180" cy="486" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="180" y="495" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">5</text><text x="240" y="482" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Pipeline stages</text><text x="240" y="510" text-anchor="start" font-size="18" font-weight="400" fill="#334155">New, Contacted, Appointment set, Active, Under contract, Closed</text><circle cx="180" cy="570" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="180" y="579" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">6</text><text x="240" y="566" text-anchor="start" font-size="24" font-weight="700" fill="#0F172A">Mobile app and notifications</text><text x="240" y="594" text-anchor="start" font-size="18" font-weight="400" fill="#334155">New leads and due tasks, on your phone</text><rect x="900" y="250" width="320" height="160" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1060.0" y="295.2" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">One week</text><text x="1060.0" y="325.5" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">Do these in order.</text><text x="1060.0" y="354.9" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">Appendix C turns them</text><text x="1060.0" y="384.4" text-anchor="middle" font-size="23" font-weight="400" fill="#0F172A">into a checklist.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Set it up completely once, then let it run your day.</text></svg>