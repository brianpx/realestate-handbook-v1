<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 11.1. Rules that arrive at each stage</title><desc id="d">A timeline of a client relationship with five stops and the rule that applies at each: consent for texts at first inquiry, agency disclosure at the first substantive conversation, a written buyer agreement before touring, documenting offers when making an offer, and confidentiality after closing. A bar says to ask your broker when unsure.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 11.1. Rules that arrive at each stage</text><path d="M110,170 L1170,170" stroke="#CBD5E1" stroke-width="5"/><text x="140" y="116.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">First inquiry</text><circle cx="140" cy="170" r="14" fill="#2563EB"/><path d="M140,190 L140,236" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="32" y="240" width="216" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="140.0" y="305.4" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Consent before</text><text x="140.0" y="329.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">automated texts.</text><text x="140.0" y="354.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Honor every</text><text x="140.0" y="378.3" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">opt-out.</text><text x="390" y="104.7" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">First substantive</text><text x="390" y="129.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">conversation</text><circle cx="390" cy="170" r="14" fill="#2563EB"/><path d="M390,190 L390,236" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="282" y="240" width="216" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="390.0" y="329.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Agency disclosure.</text><text x="390.0" y="354.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Record the date.</text><text x="640" y="104.7" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Before you tour</text><text x="640" y="129.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">homes</text><circle cx="640" cy="170" r="14" fill="#2563EB"/><path d="M640,190 L640,236" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="532" y="240" width="216" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640.0" y="305.4" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Written buyer</text><text x="640.0" y="329.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">agreement. Your</text><text x="640.0" y="354.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">state and broker</text><text x="640.0" y="378.3" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">set when.</text><text x="890" y="116.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Making an offer</text><circle cx="890" cy="170" r="14" fill="#2563EB"/><path d="M890,190 L890,236" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="782" y="240" width="216" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="890.0" y="305.4" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Document each</text><text x="890.0" y="329.7" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">offer and the</text><text x="890.0" y="354.0" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">client's</text><text x="890.0" y="378.3" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">instruction.</text><text x="1140" y="116.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">After closing</text><circle cx="1140" cy="170" r="14" fill="#2563EB"/><path d="M1140,190 L1140,236" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="1032" y="240" width="216" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1140.0" y="317.5" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">Keep client</text><text x="1140.0" y="341.8" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">information</text><text x="1140.0" y="366.2" text-anchor="middle" font-size="19" font-weight="400" fill="#0F172A">confidential.</text><rect x="140" y="490" width="1000" height="70" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="640.0" y="534.4" text-anchor="middle" font-size="26" font-weight="600" fill="#78350F">When unsure, ask your broker before you act.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Your state and broker set the details. This shows when to look for them.</text></svg>