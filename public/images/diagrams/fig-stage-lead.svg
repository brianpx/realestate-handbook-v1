<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 5.2. After four questions: active or nurture?</title><desc id="d">A decision flow after the qualifying conversation. If the lead is pre-approved or cash and moving within about 60 days, they are active. Otherwise, if there is a reason and a rough date, they are nurture with a date. If neither, they go on the long-term quarterly plan.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 5.2. After four questions: active or nurture?</text><rect x="50" y="300" width="230" height="90" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="165.0" y="338.8" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">Qualifying</text><text x="165.0" y="367.0" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">conversation</text><path d="M282,345 L330,345" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><polygon points="480,250.0 630.0,345 480,440.0 330.0,345" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="480" y="320.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Pre-approved or</text><text x="480" y="340.5" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">cash, and moving</text><text x="480" y="361.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">within about 60</text><text x="480" y="381.5" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">days?</text><path d="M480,250 L480,196" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="494" y="228" text-anchor="start" font-size="18" font-weight="700" fill="#2563EB">Yes</text><rect x="330" y="110" width="300" height="86" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="480.0" y="137.5" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Active</text><text x="480.0" y="161.4" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">Calls, showings, a</text><text x="480.0" y="184.4" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">consultation this week</text><path d="M630,345 L730,345" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="680" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">No</text><polygon points="880,250.0 1030.0,345 880,440.0 730.0,345" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="880" y="340.5" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Is there a reason</text><text x="880" y="361.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">and a rough date?</text><path d="M880,250 L880,196" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="894" y="228" text-anchor="start" font-size="18" font-weight="700" fill="#2563EB">Yes</text><rect x="730" y="110" width="300" height="86" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="880.0" y="137.5" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Nurture with a date</text><text x="880.0" y="161.4" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">The plan, plus a check on</text><text x="880.0" y="184.4" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">that date</text><path d="M880,440 L880,494" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="894" y="472" text-anchor="start" font-size="18" font-weight="700" fill="#B45309">No</text><rect x="730" y="496" width="300" height="86" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="880.0" y="535.0" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">Long-term nurture</text><text x="880.0" y="558.9" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">The quarterly plan</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Both are valuable. They need different attention this week.</text></svg>