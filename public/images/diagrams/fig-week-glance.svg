<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 8.1. A week with lead generation first</title><desc id="d">A Monday to Friday grid. Each morning starts with the CRM dashboard at 8:00 and follow-up tasks at 8:30, then a protected 90-minute prospecting block at 9:30; on Friday it is followed by the pipeline review. Afternoons hold appointments, with a content batch on Wednesday, then client work and an end-of-day CRM update.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 8.1. A week with lead generation first</text><rect x="156" y="100" width="210" height="36" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="261.0" y="124.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Mon</text><rect x="374" y="100" width="210" height="36" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="479.0" y="124.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Tue</text><rect x="592" y="100" width="210" height="36" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="697.0" y="124.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Wed</text><rect x="810" y="100" width="210" height="36" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="915.0" y="124.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Thu</text><rect x="1028" y="100" width="210" height="36" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="1133.0" y="124.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Fri</text><text x="140" y="180" text-anchor="end" font-size="18" font-weight="700" fill="#334155">8:00</text><rect x="156" y="144" width="1082" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="697.0" y="177.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">CRM dashboard, plan the day</text><text x="140" y="242" text-anchor="end" font-size="18" font-weight="700" fill="#334155">8:30</text><rect x="156" y="206" width="1082" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="697.0" y="239.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Follow-up plan tasks</text><text x="140" y="304" text-anchor="end" font-size="18" font-weight="700" fill="#334155">9:30</text><rect x="156" y="268" width="864" height="54" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="588.0" y="301.5" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Prospecting, 90 minutes (protected)</text><rect x="1028" y="268" width="210" height="54" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="1133.0" y="290.5" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Prospecting, then</text><text x="1133.0" y="311.0" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">pipeline review</text><text x="140" y="366" text-anchor="end" font-size="18" font-weight="700" fill="#334155">11:00</text><rect x="156" y="330" width="1082" height="54" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="697.0" y="363.5" text-anchor="middle" font-size="18" font-weight="400" fill="#334155">Lunch, errands, email</text><text x="140" y="428" text-anchor="end" font-size="18" font-weight="700" fill="#334155">13:00</text><rect x="156" y="392" width="210" height="54" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="261.0" y="425.5" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">Appointments</text><rect x="374" y="392" width="210" height="54" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="479.0" y="425.5" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">Appointments</text><rect x="592" y="392" width="210" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="697.0" y="414.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Content batch,</text><text x="697.0" y="437.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">marketing</text><rect x="810" y="392" width="210" height="54" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="915.0" y="425.5" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">Appointments</text><rect x="1028" y="392" width="210" height="54" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="1133.0" y="425.5" text-anchor="middle" font-size="18" font-weight="400" fill="#FFFFFF">Appointments</text><text x="140" y="490" text-anchor="end" font-size="18" font-weight="700" fill="#334155">16:00</text><rect x="156" y="454" width="1082" height="54" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="697.0" y="487.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">Client work, transaction tasks</text><text x="140" y="552" text-anchor="end" font-size="18" font-weight="700" fill="#334155">17:30</text><rect x="156" y="516" width="1082" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="697.0" y="549.5" text-anchor="middle" font-size="18" font-weight="400" fill="#0F172A">End-of-day CRM update, top three for tomorrow</text><text x="640" y="610" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB">Mornings are yours. Afternoons belong to clients.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Lead generation sits in the same place every day.</text></svg>