<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 2.1. Every lead source trades time for money</title><desc id="d">A plot of your time against your money. Sphere, open houses and expired listings sit at high time and low money. Own website and ads sit in the middle. Portal leads sit at low time and high money. The high-time, low-money corner is shaded as where new agents start.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 2.1. Every lead source trades time for money</text><rect x="140" y="110" width="760" height="480" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="520" y="350" width="380" height="240" fill="#DBEAFE" opacity="0.6"/><text x="710" y="578" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">Where new agents start</text><text x="520" y="628" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Your time (low → high)</text><text transform="translate(96,350) rotate(-90)" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Your money (low → high)</text><rect x="590" y="505" width="250" height="46" rx="23" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="715.0" y="534.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Sphere and referrals</text><rect x="590" y="440" width="250" height="46" rx="23" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="715.0" y="469.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Open houses</text><rect x="570" y="375" width="320" height="46" rx="23" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="730.0" y="404.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Expired listings and FSBOs</text><rect x="330" y="270" width="250" height="46" rx="23" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="455.0" y="299.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Own website and ads</text><rect x="170" y="160" width="250" height="46" rx="23" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="295.0" y="189.8" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Portal leads</text><rect x="930" y="250" width="310" height="130" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1085.0" y="297.5" text-anchor="middle" font-size="19" font-weight="400" fill="#B45309">Conversion rates vary by</text><text x="1085.0" y="321.8" text-anchor="middle" font-size="19" font-weight="400" fill="#B45309">market and agent. Track</text><text x="1085.0" y="346.2" text-anchor="middle" font-size="19" font-weight="400" fill="#B45309">your own.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Costs are relative. Replace this picture with your own cost per closed deal.</text></svg>