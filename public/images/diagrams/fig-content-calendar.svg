<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 3.3. Four weeks, eight posts</title><desc id="d">A grid of four weeks by three rows. Every week has a market note and an educational tip. The third row holds a monthly market update in week one, a quarterly local guide in week three and listing posts as needed in week four.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 3.3. Four weeks, eight posts</text><rect x="300" y="110" width="230" height="44" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="415.0" y="139.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Week 1</text><rect x="538" y="110" width="230" height="44" rx="10" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="653.0" y="139.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Week 2</text><rect x="776" y="110" width="230" height="44" rx="10" fill="#1E3A8A" stroke="#1