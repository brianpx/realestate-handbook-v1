th="2"/><text x="640.0" y="595.6" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">Eight posts a month, plus the monthly update. Batch the whole month in one sitting.</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">A calendar you can keep on your busiest week.</text></svg>