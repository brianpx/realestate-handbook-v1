<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 10.1. How a closing becomes your next lead</title><desc id="d">Six steps in a circle: closing day note and gift, one week call, 30 days review request, quarterly calls, home anniversary, and finally an introduction. A heavy arrow from the introduction leads to a New client box that returns to Find and back to closing day.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 10.1. How a closing becomes your next lead</text><rect x="485" y="137" width="230" height="66" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="600.0" y="166.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Closing day</text><text x="600.0" y="187.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Note and gift</text><rect x="771" y="242" width="230" height="66" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="886.0" y="271.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">1 week</text><text x="886.0" y="292.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">How is the move?</text><rect x="771" y="457" width="230" height="66" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="886.0" y="486.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">30 days</text><text x="886.0" y="507.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Ask for a review</text><rect x="485" y="567" width="230" height="66" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="600.0" y="596.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Quarterly</text><text x="600.0" y="617.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">A call with a reason</text><rect x="199" y="457" width="230" height="66" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="314.0" y="486.6" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Anniversary</text><text x="314.0" y="507.9" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Updated home value</text><rect x="199" y="242" width="230" height="66" rx="14" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="2"/><text x="314.0" y="271.6" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Introduction</text><text x="314.0" y="292.9" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">They send you someone</text><path d="M696,205 L789,239" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M886,314 L886,449" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M795,525 L693,564" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M509,565 L407,526" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M314,451 L314,316" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><rect x="24" y="120" width="180" height="66" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="114.0" y="149.6" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">New client</text><text x="114.0" y="170.9" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">back to Find</text><path d="M255,239 L175,190" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><path d="M210,156 L477,166" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-deep)"/><circle cx="600" cy="390" r="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="600" y="384.7" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Be useful,</text><text x="600" y="409.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">not salesy</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Every touch earns the right to the next one.</text></svg>