<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 10.2. The first year after closing</title><desc id="d">A timeline from closing day to month twelve: handwritten note and gift on closing day, a call at one week, a call and review request at 30 days, quarterly calls at months 3, 6 and 9, and the home anniversary at month 12. Only closing day and day 30 ask for something. After the first year come an annual event and quarterly calls.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 10.2. The first year after closing</text><path d="M80,350 L1190,350" stroke="#CBD5E1" stroke-width="5"/><circle cx="110" cy="350" r="15" fill="#1E3A8A"/><path d="M110,332 L110,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="40" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="110.0" y="181.8" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Handwritten</text><text x="110.0" y="202.3" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">note and</text><text x="110.0" y="222.8" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">gift. Ask for</text><text x="110.0" y="243.2" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">an</text><text x="110.0" y="263.7" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">introduction.</text><text x="110" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Closing day</text><circle cx="260" cy="350" r="15" fill="#2563EB"/><path d="M260,332 L260,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="190" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="260.0" y="202.3" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Call: how is</text><text x="260.0" y="222.8" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">the move</text><text x="260.0" y="243.2" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">going?</text><text x="260" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Week 1</text><circle cx="410" cy="350" r="15" fill="#1E3A8A"/><path d="M410,332 L410,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="340" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="410.0" y="181.8" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Call or</text><text x="410.0" y="202.3" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">visit. Ask</text><text x="410.0" y="222.8" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">for a review.</text><text x="410.0" y="243.2" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Second</text><text x="410.0" y="263.7" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">referral ask.</text><text x="410" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Day 30</text><circle cx="560" cy="350" r="15" fill="#2563EB"/><path d="M560,332 L560,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="490" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="560.0" y="192.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Call with a</text><text x="560.0" y="212.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">reason:</text><text x="560.0" y="233.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">market,</text><text x="560.0" y="253.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">season.</text><text x="560" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Month 3</text><circle cx="710" cy="350" r="15" fill="#2563EB"/><path d="M710,332 L710,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="640" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="710.0" y="212.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Call with a</text><text x="710.0" y="233.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">reason.</text><text x="710" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Month 6</text><circle cx="860" cy="350" r="15" fill="#2563EB"/><path d="M860,332 L860,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="790" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="860.0" y="212.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Call with a</text><text x="860.0" y="233.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">reason.</text><text x="860" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Month 9</text><circle cx="1010" cy="350" r="15" fill="#2563EB"/><path d="M1010,332 L1010,296" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="940" y="140" width="140" height="154" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1010.0" y="171.6" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">Home</text><text x="1010.0" y="192.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">anniversary:</text><text x="1010.0" y="212.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">card or call</text><text x="1010.0" y="233.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">with an</text><text x="1010.0" y="253.5" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">updated home</text><text x="1010.0" y="274.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0F172A">value.</text><text x="1010" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Month 12</text><path d="M1190,350 L1250,350" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-grey)"/><rect x="960" y="430" width="290" height="74" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1105.0" y="452.3" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">Then: an annual appreciation</text><text x="1105.0" y="472.8" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">event and quarterly calls,</text><text x="1105.0" y="493.2" text-anchor="middle" font-size="16" font-weight="400" fill="#334155">indefinitely</text><circle cx="110" cy="590" r="13" fill="#1E3A8A"/><text x="134" y="596" text-anchor="start" font-size="18" font-weight="400" fill="#334155">Touches that ask for something</text><circle cx="470" cy="590" r="13" fill="#2563EB"/><text x="494" y="596" text-anchor="start" font-size="18" font-weight="400" fill="#334155">Touches that only give</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Notice how few touches ask.</text></svg>