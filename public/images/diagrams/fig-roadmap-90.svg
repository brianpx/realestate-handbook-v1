<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 12.1. Install, build rhythm, grow pipeline</title><desc id="d">A three-phase roadmap. Days 1 to 30 install the system, days 31 to 60 build the rhythm, and days 61 to 90 grow the pipeline, each with its milestones and a flag at days 30, 60 and 90. A bar below says to fill in the scorecard every Friday and hold a monthly review.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 12.1. Install, build rhythm, grow pipeline</text><rect x="40" y="190" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M40,256 L40,204 Q40,190 54,190 L406,190 Q420,190 420,204 L420,256 Z" fill="#93C5FD"/><text x="230" y="214.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Days 1–30</text><text x="230" y="241.5" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">Install the system</text><circle cx="69" cy="288.3" r="3.5" fill="#2563EB"/><text x="84" y="294" text-anchor="start" font-size="19" font-weight="400" fill="#334155">CRM set up</text><circle cx="69" cy="321.0" r="3.5" fill="#2563EB"/><text x="84" y="326.7" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Contacts tagged</text><circle cx="69" cy="353.7" r="3.5" fill="#2563EB"/><text x="84" y="359.4" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Follow-up plans live</text><circle cx="69" cy="386.4" r="3.5" fill="#2563EB"/><text x="84" y="392.09999999999997" text-anchor="start" font-size="19" font-weight="400" fill="#334155">50 sphere conversations</text><circle cx="69" cy="419.1" r="3.5" fill="#2563EB"/><text x="84" y="424.79999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#334155">One open house</text><circle cx="69" cy="451.8" r="3.5" fill="#2563EB"/><text x="84" y="457.49999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Speed-to-lead tested</text><path d="M422,340 L448,340" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M420,150 L420,176" stroke="#1E3A8A" stroke-width="3"/><path d="M420,150 L398,158 L420,166 Z" fill="#1E3A8A"/><text x="390" y="142" text-anchor="end" font-size="18" font-weight="700" fill="#1E3A8A">Day 30</text><rect x="450" y="190" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M450,256 L450,204 Q450,190 464,190 L816,190 Q830,190 830,204 L830,256 Z" fill="#2563EB"/><text x="640" y="214.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Days 31–60</text><text x="640" y="241.5" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Build the rhythm</text><circle cx="479" cy="288.3" r="3.5" fill="#2563EB"/><text x="494" y="294" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Morning blocks 4 of 5 days</text><circle cx="479" cy="321.0" r="3.5" fill="#2563EB"/><text x="494" y="326.7" text-anchor="start" font-size="19" font-weight="400" fill="#334155">15 to 25 conversations a week</text><circle cx="479" cy="353.7" r="3.5" fill="#2563EB"/><text x="494" y="359.4" text-anchor="start" font-size="19" font-weight="400" fill="#334155">First consultations held</text><circle cx="479" cy="386.4" r="3.5" fill="#2563EB"/><text x="494" y="392.09999999999997" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Buyer agreement signed</text><path d="M832,340 L858,340" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><path d="M830,150 L830,176" stroke="#1E3A8A" stroke-width="3"/><path d="M830,150 L808,158 L830,166 Z" fill="#1E3A8A"/><text x="800" y="142" text-anchor="end" font-size="18" font-weight="700" fill="#1E3A8A">Day 60</text><rect x="860" y="190" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M860,256 L860,204 Q860,190 874,190 L1226,190 Q1240,190 1240,204 L1240,256 Z" fill="#1E3A8A"/><text x="1050" y="214.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Days 61–90</text><text x="1050" y="241.5" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Grow the pipeline</text><circle cx="889" cy="288.3" r="3.5" fill="#2563EB"/><text x="904" y="294" text-anchor="start" font-size="19" font-weight="400" fill="#334155">5 or more active opportunities</text><circle cx="889" cy="321.0" r="3.5" fill="#2563EB"/><text x="904" y="326.7" text-anchor="start" font-size="19" font-weight="400" fill="#334155">First contract written</text><circle cx="889" cy="353.7" r="3.5" fill="#2563EB"/><text x="904" y="359.4" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Post-close plan built</text><circle cx="889" cy="386.4" r="3.5" fill="#2563EB"/><text x="904" y="392.09999999999997" text-anchor="start" font-size="19" font-weight="400" fill="#334155">Lead sources evaluated</text><path d="M1240,150 L1240,176" stroke="#1E3A8A" stroke-width="3"/><path d="M1240,150 L1218,158 L1240,166 Z" fill="#1E3A8A"/><text x="1210" y="142" text-anchor="end" font-size="18" font-weight="700" fill="#1E3A8A">Day 90</text><rect x="40" y="520" width="1200" height="60" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640.0" y="557.6" text-anchor="middle" font-size="21" font-weight="600" fill="#0F172A">Every Friday: the scorecard. First working day of each month: a one-hour review.</text><text x="1240" y="612" text-anchor="end" font-size="19" font-weight="700" fill="#334155">Closings usually follow in the second 90 days →</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">Thirty days each. Date it on your calendar.</text></svg>