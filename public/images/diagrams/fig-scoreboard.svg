<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figure 8.2. What your scoreboard shows in the first 90 days</title><desc id="d">Two lines over 120 days. A blue line for activity climbs from the first day. A grey line for closings stays at zero until around day 70 and then rises. The gap between them is shaded and labelled the wait.</desc><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ah-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="14" y="14" width="1252" height="692" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="66" text-anchor="start" font-size="32" font-weight="700" fill="#0F172A">Figure 8.2. What your scoreboard shows in the first 90 days</text><rect x="160" y="120" width="940" height="400" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M160,500 C300,430 420,340 560,290 S900,200 1100,160 L1100,520 L160,520 Z" fill="#DBEAFE" stroke="#DBEAFE" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M160,500 C300,430 420,340 560,290 S900,200 1100,160" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160,520 L708,520 C800,520 880,500 1100,430" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="480" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">The wait. Watch the blue line.</text><text x="1105" y="140" text-anchor="end" font-size="18" font-weight="700" fill="#2563EB">Activity: conversations, appointments set</text><text x="1105" y="418" text-anchor="end" font-size="18" font-weight="700" fill="#334155">Closings</text><path d="M160.0,520 L160.0,530" stroke="#334155" stroke-width="2"/><text x="160.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#334155">Day 0</text><path d="M395.0,520 L395.0,530" stroke="#334155" stroke-width="2"/><text x="395.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#334155">Day 30</text><path d="M630.0,520 L630.0,530" stroke="#334155" stroke-width="2"/><text x="630.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#334155">Day 60</text><path d="M865.0,520 L865.0,530" stroke="#334155" stroke-width="2"/><text x="865.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#334155">Day 90</text><path d="M1100.0,520 L1100.0,530" stroke="#334155" stroke-width="2"/><text x="1100.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#334155">Day 120</text><text x="630" y="590" text-anchor="middle" font-size="19" font-weight="600" fill="#334155">Time since you started</text><text x="46" y="686" text-anchor="start" font-size="19" font-weight="400" fill="#334155" font-style="italic">The blue line moves every day you do the work.</text></svg>